name: Android Debug APK

# Build debug APK trực tiếp bằng Gradle wrapper (KHÔNG EAS, KHÔNG keystore).
# Mục đích: test lỗi thật trên máy — dev cấm build APK local (chi phí disk/network).
# (trigger-fix: commit chạm file workflow này để đảm bảo event push khớp paths filter)
#
# Tải artifact tại: GitHub repo → Actions → run mới nhất → "Android Debug APK" → Artifacts.
# API_BASE_URL trỏ backend production (https://appvantai-api.testhoangweb.workers.dev)
# — cài lên máy thật là test được với backend thật, KHÔNG cần `adb reverse`.
# Muốn test với worker local: sửa dart-defines bên dưới về localhost:8787 + adb reverse.

on:
  push:
    branches: [master, main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch: {}

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK (gradle trực tiếp)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 — khớp sourceCompatibility/targetCompatibility trong build.gradle.kts
      # (bài học chung: Kotlin/AGP metadata phải ghép JDK, không để default JDK 21+).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle cache TRƯỚC khi chạy gradlew — giữ các layer lớn (gradle dist, AGP deps)
      # giữa các lần chạy để tổng thời gian build ~5-8 phút thay vì 15+ phút cold.
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Flutter STABLE pin đúng bản đã dev local (không dùng @latest để tránh
      # flutter-gradle-plugin đột ngột đổi behavior giữa các lần build).
      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      # BẮT BUỘC: *.g.dart (riverpod_generator) bị gitignore theo convention —
      # checkout sạch sẽ không có chúng → thiếu _$AuthController/authControllerProvider
      # → kernel_snapshot fail hàng loạt (bài học run 34584116987).
      - name: Codegen (build_runner)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      # Gradle trực tiếp qua wrapper (task assembleDebug) — đúng yêu cầu
      # "dùng gradle trực tiếp, không cần token EAS".
      # dart-defines dạng Flutter chuẩn (comma-separated base64 từng cặp KEY=VALUE):
      #   APP_ENV=dev    (build.gradle.kts chỉ chặn release thiếu production/staging — debug luôn pass)
      #   API_BASE_URL   (backend production trên Cloudflare Workers — cài là test được ngay)
      #   SENTRY_DSN     (init runtime, không ảnh hưởng compile)
      - name: Gradle assembleDebug
        working-directory: mobile/android
        run: ./gradlew assembleDebug
          -Pdart-defines=QVBQX0VOVj1kZXY=,QVBJX0JBU0VfVVJMPWh0dHBzOi8vYXBwdmFudGFpLWFwaS50ZXN0aG9hbmd3ZWIud29ya2Vycy5kZXY=,U0VOVFJZX0RTTj1odHRwczovLzA1OTNmNjI3M2YyNTIyYmY1ZTZiYzliYTJhMmM5MWQ5QG80NTA1NDc0MDc3NzUzMzQ0LmluZ2VzdC51cy5zZW50cnkuaW8vNDUxMjA2NjU3Njc3NzIxNg==
          --stacktrace

      # Renamed trước khi upload để tên file tự giải thích.
      - name: Rename APK
        run: mv mobile/build/app/outputs/flutter-apk/app-debug.apk appvantai-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: appvantai-debug-apk
          path: appvantai-debug.apk
          retention-days: 14
