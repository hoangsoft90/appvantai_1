name: Android Debug APK

# Build debug APK trực tiếp bằng Gradle wrapper (KHÔNG EAS, KHÔNG keystore).
# Mục đích: test lỗi thật trên máy — dev cấm build APK local (chi phí disk/network).
# (trigger-fix: commit chạm file workflow này để đảm bảo event push khớp paths filter)
#
# Tải artifact tại: GitHub repo → Actions → run mới nhất → "Android Debug APK" → Artifacts.
# API_BASE_URL trỏ backend production (https://appvantai-api.testhoangweb.workers.dev)
# + Firebase Phone Auth bật (USE_FIREBASE_AUTH=true, giá trị đọc từ
# google-services.json commit trong repo — SHA debug.keystore cố định phải được
# đăng ký trên Firebase console) → cài máy thật là login SMS thật + test backend thật.

on:
  push:
    branches: [master, main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch: {}

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK (gradle trực tiếp)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 — khớp sourceCompatibility/targetCompatibility trong build.gradle.kts
      # (bài học chung: Kotlin/AGP metadata phải ghép JDK, không để default JDK 21+).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle cache TRƯỚC khi chạy gradlew — giữ các layer lớn (gradle dist, AGP deps)
      # giữa các lần chạy để tổng thời gian build ~5-8 phút thay vì 15+ phút cold.
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Flutter STABLE pin đúng bản đã dev local (không dùng @latest để tránh
      # flutter-gradle-plugin đột ngột đổi behavior giữa các lần build).
      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      # BẮT BUỘC: *.g.dart (riverpod_generator) bị gitignore theo convention —
      # checkout sạch sẽ không có chúng → thiếu _$AuthController/authControllerProvider
      # → kernel_snapshot fail hàng loạt (bài học run 34584116987).
      - name: Codegen (build_runner)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      # Gradle trực tiếp qua wrapper (task assembleDebug) — đúng yêu cầu
      # "dùng gradle trực tiếp, không cần token EAS".
      # Sinh dart-defines từ google-services.json (commit trong repo) — đúng cơ chế
      # dart-define của Phase 7 (main.dart tự Firebase.initializeApp bằng FIREBASE_*),
      # KHÔNG cần gradle plugin google-services. Format: comma-separated base64
      # từng cặp KEY=VALUE (chuẩn Flutter tool + build.gradle.kts tự decode).
      # API_BASE_URL = backend production; APP_ENV=dev → debug build không bị guard chặn.
      - name: Build dart-defines (app + Firebase từ google-services.json)
        working-directory: mobile
        run: |
          python3 - <<'EOF'
          import base64, json, os
          g = json.load(open('android/app/google-services.json'))
          c = g['client'][0]
          pairs = {
            'APP_ENV': 'dev',
            'API_BASE_URL': 'https://appvantai-api.testhoangweb.workers.dev',
            'USE_FIREBASE_AUTH': 'true',
            'FIREBASE_API_KEY': c['api_key'][0]['current_key'],
            'FIREBASE_PROJECT_ID': g['project_info']['project_id'],
            'FIREBASE_APP_ID': c['client_info']['mobilesdk_app_id'],
            'FIREBASE_MSG_SENDER_ID': g['project_info']['project_number'],
            'SENTRY_DSN': 'https://0593f6273f2522bf5e6bc9ba2a2c91d9@o4505474077753344.ingest.us.sentry.io/4512066576777216',
          }
          defines = ','.join(base64.b64encode(f'{k}={v}'.encode()).decode() for k, v in pairs.items())
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'DART_DEFINES={defines}\n')
          EOF

      # Gradle trực tiếp qua wrapper (task assembleDebug) — đúng yêu cầu
      # "dùng gradle trực tiếp, không cần token EAS".
      - name: Gradle assembleDebug
        working-directory: mobile/android
        run: ./gradlew assembleDebug -Pdart-defines="$DART_DEFINES" --stacktrace

      # Renamed trước khi upload để tên file tự giải thích.
      - name: Rename APK
        run: mv mobile/build/app/outputs/flutter-apk/app-debug.apk appvantai-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: appvantai-debug-apk
          path: appvantai-debug.apk
          retention-days: 14
